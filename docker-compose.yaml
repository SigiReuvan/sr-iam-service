version: "3"
services:
  iam-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_HOST=db
      - REDIS_ADDR=cache:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - db
      - cache
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - /tmp/data:/var/lib/postgresql/data
      - ./assets/init.sql:/docker-entrypoint-initdb.d/create_tables.sql

  cache:
    image: redis:6.2-alpine
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - /tmp/cache:/data

  # Postgres Exporter to monitor the Postgres database (RDS equivalent)
  postgres_exporter:
    image: wrouesnel/postgres_exporter:latest
    environment:
      # Build the datasource string from your environment variables
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db

  # Redis Exporter to monitor Redis
  redis_exporter:
    image: oliver006/redis_exporter:latest
    command: --redis.addr=redis://cache:6379
    ports:
      - "9121:9121"
    depends_on:
      - cache

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      # Make sure your Prometheus config file includes targets for the exporters
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: